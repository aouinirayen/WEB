# ============================================================
#  PIDEV — application.properties (version Docker / K8s)
#  Toutes les valeurs sensibles sont lues depuis les
#  variables d'environnement injectées par Kubernetes Secrets
#  Remplace l'ancien fichier avec localhost et chemins Windows
# ============================================================

spring.application.name=PIDEV

# ── DataSource MySQL ───────────────────────────────────────
# ${SPRING_DATASOURCE_URL} injecté par K8s Secret
# Host : pidev-mysql-master-service (ClusterIP K8s)
# Port : 3306, BDD : PIDEV
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://pidev-mysql-master-service:3306/PIDEV?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&maxAllowedPacket=67108864}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ── JWT ────────────────────────────────────────────────────
app.jwtSecret=${APP_JWT_SECRET:changeme_replace_in_k8s_secret}
app.jwtExpirationMs=90000
app.jwtRefreshThresholdMs=30000

# ── Multipart upload ───────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Email (Gmail SMTP) ─────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.debug=false

# ── App Configuration ──────────────────────────────────────
# En K8s : APP_FRONTEND_URL = URL du LoadBalancer Angular
app.frontend.url=${APP_FRONTEND_URL:http://pidev-frontend-service}
app.password.reset.token.expiry.hours=24
server.port=8081

# ── Fichiers uploadés ──────────────────────────────────────
# Remplace C:/xampp/htdocs/pidev-uploads → /app/uploads (PVC K8s)
app.file.upload.dir=${FILE_UPLOAD_DIR:/app/uploads}
app.file.max-size=10485760
file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads}/licenses

# Servir les fichiers uploadés via HTTP
spring.web.resources.static-locations=file:${FILE_UPLOAD_DIR:/app/uploads}/
spring.web.resources.cache.period=3600
spring.web.resources.cache.cachecontrol.max-age=3600

# ── Scheduled Jobs ─────────────────────────────────────────
app.scheduled.expiry-check.cron=0 0 0 * * *
app.scheduled.expiry-notification.cron=0 0 10 * * *
app.scheduled.audit-log-cleanup.cron=0 0 1 * * *
app.audit-log.retention-days=7

# ── Swagger / OpenAPI ──────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ── Gemini API ─────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}

# ── Stripe ─────────────────────────────────────────────────
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.success-url=${APP_FRONTEND_URL:http://pidev-frontend-service}/payment/success
stripe.cancel-url=${APP_FRONTEND_URL:http://pidev-frontend-service}/payment/cancel

# ── Logging ────────────────────────────────────────────────
logging.level.root=INFO
logging.level.tn.esprit.pidev.security=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
