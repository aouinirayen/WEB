<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold">{{ isEdit ? 'Edit' : 'Add' }} Trip</h4>
    <a routerLink="/admin/trips" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-arrow-left"></i> Back
    </a>
  </div>
  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form #tripForm="ngForm" (ngSubmit)="save()">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Schedule</label>
            <select class="form-select" [(ngModel)]="selectedScheduleId"
                    name="scheduleId" (change)="onScheduleChange()" required>
                    <option [ngValue]="null" disabled>-- Select schedule --</option>
                    <option *ngFor="let s of schedules" [value]="s.id">
                        {{ s.line.code }} — {{ s.vehicle.plateNumber }} — {{ s.dayType }}
                      </option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Delay (minutes)</label>
            <input type="number" class="form-control"
                   [(ngModel)]="trip.delayMinutes" name="delayMinutes" min="0">
          </div>
          <div class="col-md-6">
            <label class="form-label">Departure Time</label>
            <input type="datetime-local" class="form-control"
                   [(ngModel)]="trip.departureTime" name="departureTime" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Arrival Time</label>
            <input type="datetime-local" class="form-control"
                   [(ngModel)]="trip.arrivalTime" name="arrivalTime" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Completed</label>
            <select class="form-select" [(ngModel)]="trip.completed" name="completed">
              <option [ngValue]="false">No</option>
              <option [ngValue]="true">Yes</option>
            </select>
          </div>
        </div>
        <div class="mt-4">
          <button type="submit" class="btn btn-secondary me-2"
                  [disabled]="tripForm.invalid || trip.arrivalTime <= trip.departureTime">
            {{ isEdit ? 'Update' : 'Create' }}
          </button>
          <a routerLink="/admin/trips" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
