<!-- ============================================================
     LOGIN PAGE – Angular (inspired by React template)
     Split-screen: image left, form right
     ============================================================ -->
<div class="auth-page">

  <!-- LEFT PANEL: Rotating transport images -->
  <div class="auth-visual">
    <div class="visual-slider">
      <div class="slide" *ngFor="let img of transportImages; let i = index"
           [class.active]="i === currentSlide"
           [style.background-image]="'url(' + img.url + ')'">
      </div>
    </div>
    <div class="visual-overlay"></div>
    <div class="visual-content">
      <div class="visual-logo">
        <svg class="tram-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M7 17v2M17 17v2M2 10h20"/>
          <circle cx="7" cy="17" r="1"/><circle cx="17" cy="17" r="1"/>
        </svg>
        <span>TransitTN</span>
      </div>
      <div class="visual-text">
        <h2>{{ transportImages[currentSlide]?.label }}</h2>
        <p>Tunisia's integrated public transport management platform</p>
      </div>
      <div class="slide-dots">
        <span *ngFor="let img of transportImages; let i = index"
              class="dot" [class.active]="i === currentSlide"
              (click)="goToSlide(i)"></span>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL: Login form -->
  <div class="auth-form-panel">
    <div class="form-inner">

      <!-- Header -->
      <div class="form-header">
        <div class="form-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <path d="M7 17v2M17 17v2M2 10h20"/>
            <circle cx="7" cy="17" r="1"/><circle cx="17" cy="17" r="1"/>
          </svg>
        </div>
        <h1>Welcome back</h1>
        <p>Sign in to your TransitTN account</p>
      </div>

      <!-- Error -->
      <div class="alert-error" *ngIf="error">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
        {{ error }}
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>

        <!-- Username -->
        <div class="field-group">
          <label for="username">Username</label>
          <div class="field-input-wrapper">
            <svg class="field-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
            </svg>
            <input
              id="username"
              type="text"
              formControlName="username"
              placeholder="Enter your username"
              [class.invalid]="submitted && f['username'].errors"
              autocomplete="username"
            />
          </div>
          <span class="field-error" *ngIf="submitted && f['username'].errors?.['required']">Username is required</span>
        </div>

        <!-- Password -->
        <div class="field-group">
          <label for="password">Password</label>
          <div class="field-input-wrapper">
            <svg class="field-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
            </svg>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Enter your password"
              [class.invalid]="submitted && f['password'].errors"
              autocomplete="current-password"
            />
            <button type="button" class="eye-btn" (click)="togglePasswordVisibility()" tabindex="-1">
              <svg *ngIf="!showPassword" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd"/>
                <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.064 7 9.542 7 .847 0 1.669-.105 2.454-.303z"/>
              </svg>
            </button>
          </div>
          <span class="field-error" *ngIf="submitted && f['password'].errors?.['required']">Password is required</span>
        </div>

        <!-- Forgot password link -->
        <div class="form-extras">
          <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-submit" [class.loading]="loading" [disabled]="loading">
          <span class="btn-spinner" *ngIf="loading">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="30 60"/></svg>
          </span>
          <span *ngIf="!loading">Sign In</span>
          <span *ngIf="loading">Signing in...</span>
        </button>

        <!-- Divider -->
        <div class="divider"><span>or</span></div>

        <!-- Register link -->
        <p class="switch-link">
          Don't have an account?
          <a routerLink="/register">Create one</a>
        </p>

      </form>
    </div>
  </div>

</div>
