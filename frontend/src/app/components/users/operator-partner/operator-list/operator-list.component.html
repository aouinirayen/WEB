<div class="row mb-4">
  <div class="col-12">
    <h4 style="color:#1a237e; font-weight:700;">
      <i class="fas fa-bus"></i> Transport Operators
    </h4>
    <hr style="border-color:#1a73e8; border-width:2px; width:60px; margin-left:0;">
  </div>
</div>

<div class="row">
  <div class="col-md-4 mb-4" *ngFor="let op of operators">
    <div class="card-3d"
         #card3d
         (mousemove)="onMouseMove($event, card3d)"
         (mouseleave)="onMouseLeave(card3d)">

      <!-- Header -->
      <div style="background: linear-gradient(135deg, #1a237e, #3949ab);
                  padding:30px 20px; text-align:center;
                  border-radius:16px 16px 0 0; position:relative;">
        <span style="position:absolute; top:12px; right:12px;
                     background:rgba(255,255,255,0.2); color:white;
                     padding:3px 12px; border-radius:20px;
                     font-size:0.75rem; font-weight:600;">
          {{ op.coverageType }}
        </span>

        <!-- Cercle avec logo -->
        <div style="width:75px; height:75px; border-radius:50%;
                    background:white;
                    display:flex; align-items:center; justify-content:center;
                    margin:0 auto 12px; border:3px solid rgba(255,255,255,0.4);
                    overflow:hidden;">
          <img *ngIf="op.logo" [src]="op.logo"
               style="width:100%; height:100%; object-fit:contain; padding:5px;">
          <i *ngIf="!op.logo" class="fas fa-bus"
             style="font-size:2rem; color:#1a237e;"></i>
        </div>

        <h5 style="color:white; font-weight:700; margin:0; font-size:1.1rem;">
          {{ op.name }}
        </h5>
        <span style="color:rgba(255,255,255,0.75); font-size:0.85rem;">
          {{ op.acronyme }}
        </span>
      </div>

      <!-- Body -->
      <div style="padding:18px; background:white; border-radius:0 0 16px 16px;">
        <div style="display:flex; align-items:center; gap:10px;
                    padding:8px 0; border-bottom:1px solid #f5f5f5;">
          <div style="width:32px; height:32px; border-radius:8px;
                      background:#e3f2fd; display:flex;
                      align-items:center; justify-content:center; flex-shrink:0;">
            <i class="fas fa-envelope" style="color:#1a73e8; font-size:0.8rem;"></i>
          </div>
          <span style="color:#666; font-size:0.85rem;
                       overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
            {{ op.email }}
          </span>
        </div>

        <div style="display:flex; align-items:center; gap:10px;
                    padding:8px 0; border-bottom:1px solid #f5f5f5;">
          <div style="width:32px; height:32px; border-radius:8px;
                      background:#fff8e1; display:flex;
                      align-items:center; justify-content:center; flex-shrink:0;">
            <i class="fas fa-phone" style="color:#f57f17; font-size:0.8rem;"></i>
          </div>
          <span style="color:#666; font-size:0.85rem;">{{ op.phoneNumber }}</span>
        </div>

        <div style="display:flex; align-items:center; gap:10px; padding:8px 0;">
          <div style="width:32px; height:32px; border-radius:8px;
                      background:#e8f5e9; display:flex;
                      align-items:center; justify-content:center; flex-shrink:0;">
            <i class="fas fa-building" style="color:#2e7d32; font-size:0.8rem;"></i>
          </div>
          <span style="color:#666; font-size:0.85rem;">{{ op.type }}</span>
          <span style="margin-left:auto; background:#e8f5e9; color:#2e7d32;
                       padding:3px 10px; border-radius:20px;
                       font-size:0.75rem; font-weight:600;">
            {{ op.status }}
          </span>
        </div>

        <a [routerLink]="['/operators', op.id]"
           style="display:flex; align-items:center; justify-content:center;
                  gap:8px; background: linear-gradient(135deg, #1a73e8, #0d47a1);
                  color:white; text-decoration:none; padding:10px;
                  border-radius:10px; font-weight:600; font-size:0.9rem;
                  margin-top:12px; transition:opacity 0.2s;"
           onmouseover="this.style.opacity='0.85'"
           onmouseout="this.style.opacity='1'">
          <i class="fas fa-eye"></i> View Details
        </a>
      </div>

    </div>
  </div>

  <div class="col-12" *ngIf="operators.length === 0">
    <div style="text-align:center; padding:40px; color:#999;">
      <i class="fas fa-bus" style="font-size:3rem; margin-bottom:15px; display:block;"></i>
      No operators found.
    </div>
  </div>
</div>
