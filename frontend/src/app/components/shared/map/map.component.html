<div style="width:100%; border-radius:12px; overflow:hidden; border:2px solid #e3f2fd;">
  <div *ngIf="zones.length > 0" style="background:#e3f2fd; padding:10px 15px;
              display:flex; gap:10px; flex-wrap:wrap;">
    <span *ngFor="let zone of zones"
          style="background:#1a73e8; color:white; padding:4px 12px;
                 border-radius:20px; font-size:0.8rem; font-weight:600;">
      📍 {{ zone.governorate }}
      <span *ngIf="zone.isHeadquarter"> ⭐</span>
    </span>
  </div>

  <div style="width:100%; height:350px; overflow:hidden; position:relative;">
    <iframe *ngIf="mapUrl"
            [src]="mapUrl"
            style="position:absolute; top:0; left:0;
                   width:100%; height:100%; border:none;"
            loading="lazy">
    </iframe>
  </div>

  <div *ngIf="zones.length === 0"
       style="height:200px; display:flex; align-items:center;
              justify-content:center; color:#999;">
    <div style="text-align:center;">
      <i class="fas fa-map-marker-alt" style="font-size:2rem; margin-bottom:10px; display:block;"></i>
      No zones to display
    </div>
  </div>
</div>
