<div class="container py-5">
    <h2 class="fw-bold mb-1">All Lines</h2>
    <p class="text-muted mb-4">Click on a line to see its stops</p>
  
    <div class="row g-3">
      <div class="col-12" *ngFor="let l of lines">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center"
                 style="cursor:pointer" (click)="toggleLine(l.id!)">
              <div class="d-flex align-items-center gap-3">
                <span class="badge fs-6 px-3 py-2"
                      style="background:#1a1a2e">{{ l.code }}</span>
                <div>
                  <h6 class="mb-0 fw-bold">{{ l.name }}</h6>
                  <small class="text-muted">{{ l.mode }}</small>
                </div>
              </div>
              <div class="d-flex align-items-center gap-2">
                <span class="badge"
                  [class.bg-success]="l.status==='ACTIVE'"
                  [class.bg-danger]="l.status==='INACTIVE'"
                  [class.bg-warning]="l.status==='SUSPENDED'">
                  {{ l.status }}
                </span>
                <i class="bi"
                   [class.bi-chevron-down]="expandedLine !== l.id"
                   [class.bi-chevron-up]="expandedLine === l.id"></i>
              </div>
            </div>
  
            <!-- Stops -->
            <div *ngIf="expandedLine === l.id" class="mt-3 pt-3
                 border-top">
              <p class="text-muted mb-2" style="font-size:13px">
                <i class="bi bi-geo-alt me-1"></i>Stops
              </p>
              <div *ngIf="!stops[l.id!]" class="text-muted">
                Loading...
              </div>
              <div class="d-flex flex-wrap gap-2" *ngIf="stops[l.id!]">
                <span *ngFor="let s of stops[l.id!]"
                      class="badge bg-light text-dark border">
                  {{ s.sequence }}. {{ s.name }}
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
