<div class="container py-5">
    <h2 class="fw-bold mb-1">Schedules</h2>
    <p class="text-muted mb-4">Select a line to view its schedules</p>
  
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <label class="form-label fw-bold">Select Line</label>
        <select class="form-select" [(ngModel)]="selectedLineId"
                (change)="onLineSelect()">
          <option [value]="null">-- Choose a line --</option>
          <option *ngFor="let l of lines" [value]="l.id">
            {{ l.code }} — {{ l.name }}
          </option>
        </select>
      </div>
    </div>
  
    <div *ngIf="schedules.length > 0">
      <div class="row g-3">
        <div class="col-md-6" *ngFor="let s of schedules">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="d-flex justify-content-between mb-2">
                <span class="badge"
                  [class.bg-primary]="s.dayType==='WEEKDAY'"
                  [class.bg-success]="s.dayType==='WEEKEND'"
                  [class.bg-warning]="s.dayType==='HOLIDAY'">
                  {{ s.dayType }}
                </span>
                <small class="text-muted">
                  every {{ s.frequencyMinutes }} min
                </small>
              </div>
              <div class="d-flex justify-content-between mt-3">
                <div class="text-center">
                  <p class="text-muted mb-0" style="font-size:12px">
                    First departure
                  </p>
                  <h5 class="fw-bold mb-0" style="color:#00b4d8">
                    {{ s.startTime }}
                  </h5>
                </div>
                <i class="bi bi-arrow-right align-self-center
                          text-muted"></i>
                <div class="text-center">
                  <p class="text-muted mb-0" style="font-size:12px">
                    Last departure
                  </p>
                  <h5 class="fw-bold mb-0" style="color:#1a1a2e">
                    {{ s.endTime }}
                  </h5>
                </div>
              </div>
              <hr>
              <small class="text-muted">
                <i class="bi bi-bus-front me-1"></i>
                {{ s.vehicle.brand }} — {{ s.vehicle.plateNumber }}
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>
  
    <div *ngIf="selectedLineId && schedules.length === 0"
         class="text-center text-muted py-5">
      <i class="bi bi-calendar-x fs-1"></i>
      <p class="mt-2">No schedules found for this line</p>
    </div>
  </div>
