<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold">Vehicles</h4>
    <a routerLink="/admin/vehicles/new" class="btn btn-primary btn-sm">
      <i class="bi bi-plus"></i> Add Vehicle
    </a>
  </div>
  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Plate</th><th>Brand</th><th>Type</th>
            <th>Capacity</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let v of vehicles">
            <td>{{ v.plateNumber }}</td>
            <td>{{ v.brand }}</td>
            <td>{{ v.type }}</td>
            <td>{{ v.capacity }}</td>
            <td>
              <span class="badge"
                [class.bg-success]="v.status==='ACTIVE'"
                [class.bg-danger]="v.status==='INACTIVE'"
                [class.bg-warning]="v.status==='IN_MAINTENANCE'">
                {{ v.status }}
              </span>
            </td>
            <td>
              <a [routerLink]="['/admin/vehicles/edit', v.id]"
                 class="btn btn-sm btn-outline-primary me-1">
                <i class="bi bi-pencil"></i>
              </a>
              <button (click)="delete(v.id!)"
                      class="btn btn-sm btn-outline-danger">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
