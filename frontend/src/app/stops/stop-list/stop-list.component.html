<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold">Stops</h4>
    <a routerLink="/admin/stops/new" class="btn btn-primary btn-sm">
      <i class="bi bi-plus"></i> Add Stop
    </a>
  </div>
  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Name</th>
            <th>Line</th>
            <th>Sequence</th>
            <th>Latitude</th>
            <th>Longitude</th>
            <th>Actions</th>
          </tr>
        </thead>
            <tbody *ngIf="stops?.length">

          <tr *ngFor="let s of stops">
            <td>{{ s.name }}</td>
            <td>{{ s.line.code }} - {{ s.line.name }}</td>            <td><span class="badge bg-secondary">{{ s.sequence }}</span></td>
            <td>{{ s.latitude }}</td>
            <td>{{ s.longitude }}</td>
            <td>
              <a [routerLink]="['/admin/stops/edit', s.id]"
                 class="btn btn-sm btn-outline-primary me-1">
                <i class="bi bi-pencil"></i>
              </a>
              <button (click)="delete(s.id!)"
                      class="btn btn-sm btn-outline-danger">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
