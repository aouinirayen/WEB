<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="fw-bold">Incident Reports</h4>
  <a routerLink="/incidents/new" class="btn btn-danger btn-sm">
    <i class="bi bi-plus"></i> Report Incident
  </a>
</div>
<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th>Vehicle</th>
          <th>Line</th>
          <th>Type</th>
          <th>Severity</th>
          <th>Reported By</th>
          <th>Reported At</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let i of incidents">
          <td>{{ i.vehicle?.plateNumber }}</td>
          <td>
            <span *ngIf="i.line" class="badge bg-info text-dark">{{ i.line.code }}</span>
            <span *ngIf="!i.line" class="text-muted">—</span>
          </td>
          <td>{{ i.type }}</td>
          <td>
            <span class="badge"
              [class.bg-secondary]="i.severity === 'LOW'"
              [class.bg-warning]="i.severity === 'MEDIUM'"
              [class.bg-danger]="i.severity === 'HIGH'"
              [class.bg-dark]="i.severity === 'CRITICAL'">
              {{ i.severity }}
            </span>
          </td>
          <td>{{ i.reportedBy }}</td>
          <td>{{ i.reportedAt | date:'short' }}</td>
          <td>
            <span class="badge"
              [class.bg-danger]="i.status === 'OPEN'"
              [class.bg-warning]="i.status === 'IN_PROGRESS'"
              [class.bg-success]="i.status === 'RESOLVED'"
              [class.bg-secondary]="i.status === 'CLOSED'">
              {{ i.status }}
            </span>
          </td>
          <td>
            <a [routerLink]="['/incidents/edit', i.id]"
               class="btn btn-sm btn-outline-primary me-1">
              <i class="bi bi-pencil"></i>
            </a>
            <button (click)="delete(i.id!)"
                    class="btn btn-sm btn-outline-danger">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
