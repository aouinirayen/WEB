<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold">{{ isEdit ? 'Edit' : 'Add' }} Schedule</h4>
    <a routerLink="/admin/schedules" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-arrow-left"></i> Back
    </a>
  </div>
  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form #scheduleForm="ngForm" (ngSubmit)="save()">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Line</label>
            <select class="form-select" [(ngModel)]="selectedLineId"
                    name="lineId" (change)="onLineChange()" required>
              <option [ngValue]="null" disabled>-- Select line --</option>
              <option *ngFor="let l of lines" [value]="l.id">
                {{ l.code }} - {{ l.name }}
              </option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Vehicle</label>
            <select class="form-select" [(ngModel)]="selectedVehicleId"
                    name="vehicleId" (change)="onVehicleChange()" required>
              <option [ngValue]="null" disabled>-- Select vehicle --</option>
              <option *ngFor="let v of vehicles" [value]="v.id">
                {{ v.plateNumber }} - {{ v.brand }}
              </option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Day Type</label>
            <select class="form-select" [(ngModel)]="schedule.dayType" name="dayType">
              <option>WEEKDAY</option>
              <option>WEEKEND</option>
              <option>HOLIDAY</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Start Time</label>
            <input type="time" class="form-control"
                   [(ngModel)]="schedule.startTime" name="startTime" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">End Time</label>
            <input type="time" class="form-control"
                   [(ngModel)]="schedule.endTime" name="endTime" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Frequency (minutes)</label>
            <input type="number" class="form-control"
                   [(ngModel)]="schedule.frequencyMinutes"
                   name="frequencyMinutes" required min="1">
          </div>
        </div>
        <div class="mt-4">
          <button type="submit" class="btn btn-info me-2"
                  [disabled]="scheduleForm.invalid || schedule.endTime <= schedule.startTime">
            {{ isEdit ? 'Update' : 'Create' }}
          </button>
          <a routerLink="/admin/schedules" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
